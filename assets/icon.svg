  <rect x="118" y="148" width="60" height="17" rx="8.5" fill="#FFFFFF"/>
  <!-- Enhance: a four-point spark -->
  <path d="M182 50 C185.5 74 190 78.5 214 82 C190 85.5 185.5 90 182 114 C178.5 90 174 85.5 150 82 C174 78.5 178.5 74 182 50 Z" fill="#FBBF24"/>
